apiVersion: v1
kind: Secret
metadata: {name: dt-otlp}
stringData:
  DT_TENANT: "YOUR_ENV_ID"        # <env-id>.live.dynatrace.com
  DT_API_TOKEN: "dt0c01.xxx"      # scopes: openTelemetryTrace.ingest, metrics.ingest, logs.ingest
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: adk-agent}
spec:
  replicas: 2
  selector: {matchLabels: {app: adk-agent}}
  template:
    metadata: {labels: {app: adk-agent}}
    spec:
      containers:
      - name: agent
        image: REGION-docker.pkg.dev/PROJECT/repo/adk-agent-demo:v1
        ports: [{containerPort: 8080}]
        env:
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
        - {name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "delta"}
        - {name: ENV, value: "gke-demo"}
        resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 512Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: adk-agent}
spec:
  type: LoadBalancer
  selector: {app: adk-agent}
  ports: [{port: 80, targetPort: 8080}]
